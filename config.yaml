datasets:
  donation_type:
    format: yolo
    root: donation_type/obj_train_data
    splits: null
    # head-to-head vs ResNet: uncomment after training the baseline
    # subset_manifest: results/resnet_donation_type/test_manifest.txt
  defects:
    format: yolo
    root: obj_train_data
    splits: null
    # subset_manifest: results/resnet_defects/test_manifest.txt
  freshness:
    format: coco
    root: produce/custom_produce
    coco_json: produce/instances_default_produce.json
    splits: null
    # subset_manifest: results/resnet_freshness/test_manifest.txt

paths:
  subset_manifest: null
  output_dir: results

runtime:
  seed: 42
  device_map: auto
  load_in_4bit: false        # A100-80GB: fp16 is fine and faster
  torch_dtype: float16
  max_new_tokens: 128
  tau_spoil: 0.5
  tau_degrad: 0.5

models:
  llava15_7b:
    backend: hf
    hf_id: llava-hf/llava-1.5-7b-hf
    family: llava
  qwen2_vl_7b:
    backend: hf
    hf_id: Qwen/Qwen2-VL-7B-Instruct
    family: qwen2_vl
  qwen25_vl_7b:
    backend: hf
    hf_id: Qwen/Qwen2.5-VL-7B-Instruct
    family: qwen25_vl
  internvl3_8b:
    backend: hf
    hf_id: OpenGVLab/InternVL3-8B-hf
    family: internvl
  llama32_11b_vision:
    backend: hf
    hf_id: meta-llama/Llama-3.2-11B-Vision-Instruct
    family: mllama

tasks:
  donation_type:
    strategies: [freeform_neutral, logit_multichoice]
  freshness:
    strategies: [freeform_neutral, freeform_inspector, logit_cascade]
  defects:
    strategies: [freeform_list, logit_per_defect]
